<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Đăng nhập - Admin CLB Võ Cổ Truyền HUTECH</title>
    <link rel="stylesheet" href="shared/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../assets/js/config.js"></script>
    <style>
        /* ===== Trang đăng nhập Admin — tông Xanh · Vàng · Trắng theo logo ===== */
        :root {
            --lg-navy:   #0a2a5e;
            --lg-navy2:  #0f3570;
            --lg-blue:   #1450a3;
            --lg-blue2:  #1e63c4;
            --lg-yellow: #ffd500;
            --lg-text:   #1f2937;
            --lg-muted:  #64748b;
            --lg-border: #dbe3ef;
        }

        .login-page {
            background:
                radial-gradient(circle at 85% 10%, rgba(255, 213, 0, 0.10) 0, transparent 35%),
                radial-gradient(circle at 10% 90%, rgba(43, 125, 224, 0.25) 0, transparent 40%),
                linear-gradient(135deg, var(--lg-navy) 0%, var(--lg-navy2) 55%, var(--lg-navy) 100%);
        }
        /* Bỏ 2 vòng tròn trang trí cũ (màu đỏ) của shared/style.css */
        .login-page::before, .login-page::after { display: none; }

        .login-box {
            max-width: 400px;
            padding: 40px 36px 28px;
            border-radius: 20px;
            border-top: 5px solid var(--lg-yellow);
            box-shadow: 0 30px 70px rgba(3, 15, 40, 0.45);
            animation: lgIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes lgIn {
            from { opacity: 0; transform: translateY(24px); }
            to   { opacity: 1; transform: none; }
        }

        .login-logo { margin-bottom: 26px; }
        .login-logo img {
            width: 88px; height: 88px;
            border-radius: 18px;
            object-fit: contain;
            background: #fff;
            padding: 6px;
            border: 2px solid rgba(20, 80, 163, 0.15);
            box-shadow: 0 8px 24px rgba(20, 80, 163, 0.18);
        }
        .login-logo h2 {
            margin-top: 16px;
            font-size: 1.45rem;
            color: var(--lg-navy);
        }
        .login-logo p { color: var(--lg-muted); }
        .login-badge {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 10px;
            padding: 4px 12px;
            border-radius: 999px;
            background: rgba(20, 80, 163, 0.08);
            color: var(--lg-blue);
            font-size: 0.75rem; font-weight: 600;
        }

        /* Trạng thái máy chủ */
        .lg-status {
            display: none;
            align-items: flex-start; gap: 10px;
            padding: 11px 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            font-size: 0.83rem; line-height: 1.55;
            border: 1px solid transparent;
        }
        .lg-status.show { display: flex; }
        .lg-status i { margin-top: 3px; flex-shrink: 0; }
        .lg-status.waking  { background: #fff8db; border-color: #fde68a; color: #7a5b00; }
        .lg-status.offline { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
        .lg-status.online  { background: #ecfdf3; border-color: #bbf7d0; color: #166534; }
        .lg-status.info    { background: #eef4fd; border-color: #cddcf3; color: #1450a3; }
        .lg-link-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-top: 8px; padding: 6px 12px;
            border: 0; border-radius: 8px; cursor: pointer;
            background: var(--lg-blue); color: #fff;
            font-family: inherit; font-size: 0.8rem; font-weight: 600; line-height: 1.2;
        }
        .lg-link-btn:hover { filter: brightness(1.1); }
        .lg-link-btn.ghost { background: transparent; color: var(--lg-blue); padding: 0; margin: 0; text-decoration: underline; }
        .lg-status code {
            background: rgba(0,0,0,0.06); padding: 1px 6px; border-radius: 4px;
            font-size: 0.78rem;
        }

        /* Ô nhập */
        .login-box .form-group { margin-bottom: 16px; }
        .login-box .form-label {
            display: flex; align-items: center; gap: 7px;
            margin-bottom: 7px;
            font-size: 0.85rem; font-weight: 600;
            color: var(--lg-text);
        }
        .login-box .form-label i { color: var(--lg-blue); font-size: 0.85rem; width: 14px; }
        .lg-input { position: relative; }
        .login-box .form-control {
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1.5px solid var(--lg-border);
            border-radius: 10px;
            background: #f8fafd;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }
        .login-box .form-control:hover { border-color: #c3d0e4; }
        .login-box .form-control:focus {
            background: #fff;
            border-color: var(--lg-blue);
            box-shadow: 0 0 0 4px rgba(20, 80, 163, 0.12);
        }
        .lg-input .form-control { padding-right: 46px; }
        .lg-eye {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 36px; height: 36px;
            border: 0; border-radius: 8px;
            background: transparent; color: var(--lg-muted);
            cursor: pointer; font-size: 0.95rem;
        }
        .lg-eye:hover { color: var(--lg-blue); background: rgba(20, 80, 163, 0.06); }
        .lg-eye:focus-visible { outline: 2px solid var(--lg-blue); outline-offset: 1px; }
        .lg-caps {
            display: none;
            margin-top: 6px;
            font-size: 0.76rem; color: #b45309;
        }
        .lg-caps.show { display: block; }

        /* Nút đăng nhập */
        .login-box .btn-primary {
            width: 100%; justify-content: center;
            margin-top: 6px;
            padding: 13px;
            border-radius: 10px;
            font-size: 1rem; font-weight: 700; letter-spacing: 0.2px;
            background: linear-gradient(135deg, var(--lg-blue) 0%, var(--lg-navy2) 100%);
            box-shadow: 0 10px 22px rgba(20, 80, 163, 0.30);
            transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
        }
        .login-box .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 14px 28px rgba(20, 80, 163, 0.38);
            filter: brightness(1.08);
        }
        .login-box .btn-primary:active:not(:disabled) { transform: none; }
        .login-box .btn-primary:disabled { opacity: 0.75; cursor: wait; }

        #msg .alert { margin-bottom: 16px; }

        .login-divider { text-align: center; margin-top: 22px; }
        .login-divider a {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 7px 12px; border-radius: 8px;
            color: var(--lg-muted); font-size: 0.83rem; text-decoration: none;
            transition: color 0.2s, background 0.2s;
        }
        .login-divider a:hover { color: var(--lg-blue); background: rgba(20, 80, 163, 0.06); }

        .lg-foot {
            margin-top: 18px; padding-top: 14px;
            border-top: 1px solid #eef2f7;
            text-align: center;
            font-size: 0.72rem; color: #94a3b8;
        }

        @media (max-width: 480px) {
            .login-box { padding: 32px 22px 22px; }
            .login-logo img { width: 76px; height: 76px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .login-box { animation: none; }
        }
    </style>
</head>
<body class="login-page">

<main class="login-box">
    <div class="login-logo">
        <img src="../assets/images_Logo/Logo.jpg" alt="Logo CLB Võ Cổ Truyền HUTECH"
             onerror="this.onerror=null;this.src='../assets/images_Logo/Logo2.jpg';">
        <h2>Quản trị CLB</h2>
        <p>Võ Cổ Truyền HUTECH</p>
        <span class="login-badge"><i class="fas fa-shield-alt"></i> Chỉ dành cho tài khoản Admin</span>
    </div>

    <!-- Trạng thái máy chủ: chỉ hiện khi đang khởi động / lỗi / vừa kết nối lại -->
    <div id="status" class="lg-status" role="status" aria-live="polite"></div>

    <div id="msg" aria-live="assertive"></div>

    <form id="frm" novalidate>
        <div class="form-group">
            <label class="form-label" for="email"><i class="fas fa-envelope"></i> Email</label>
            <input class="form-control" type="email" id="email" name="username"
                   placeholder="Nhập email quản trị"
                   autocomplete="username" required autofocus>
        </div>
        <div class="form-group">
            <label class="form-label" for="pw"><i class="fas fa-lock"></i> Mật khẩu</label>
            <div class="lg-input">
                <input class="form-control" type="password" id="pw" name="password"
                       placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                <button type="button" class="lg-eye" id="eye" aria-label="Hiện mật khẩu" title="Hiện mật khẩu">
                    <i class="fas fa-eye"></i>
                </button>
            </div>
            <div class="lg-caps" id="caps"><i class="fas fa-arrow-up"></i> Đang bật Caps Lock</div>
        </div>

        <button class="btn btn-primary" type="submit" id="btn">
            <i class="fas fa-sign-in-alt"></i> Đăng nhập
        </button>
    </form>

    <div class="login-divider">
        <a href="../index.html"><i class="fas fa-arrow-left"></i> Về trang chủ</a>
    </div>
    <div class="lg-foot">© CLB Võ Cổ Truyền HUTECH</div>
</main>

<script>
(function () {
    var API = (window.APP_CONFIG && window.APP_CONFIG.API_BASE) || 'http://localhost:3001/api';
    var HEALTH = API.replace(/\/api$/, '') + '/health';
    var TOKEN_KEY = 'adm_tk';
    var USER_KEY  = 'adm_usr';
    var CFG = window.APP_CONFIG || {};
    // IS_LOCAL = đang gọi backend trên máy (cổng 3001), không phải "trang mở từ máy"
    var IS_LOCAL = /\/\/(localhost|127\.0\.0\.1)(:|\/)/.test(API);

    var form = document.getElementById('frm');
    var emailEl = document.getElementById('email');
    var pwEl = document.getElementById('pw');
    var btn = document.getElementById('btn');
    var msgEl = document.getElementById('msg');
    var statusEl = document.getElementById('status');
    var BTN_HTML = btn.innerHTML;

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }
    function showMsg(text, type, icon) {
        msgEl.innerHTML = '<div class="alert alert-' + type + '"><i class="fas fa-' + icon + '"></i><div>' + text + '</div></div>';
    }
    function setStatus(kind, html) {
        if (!kind) { statusEl.className = 'lg-status'; statusEl.innerHTML = ''; return; }
        var icon = { waking: 'fas fa-spinner fa-spin', offline: 'fas fa-exclamation-triangle', online: 'fas fa-check-circle', info: 'fas fa-globe-asia' }[kind];
        statusEl.className = 'lg-status show ' + kind;
        statusEl.innerHTML = '<i class="' + icon + '"></i><div>' + html + '</div>';
    }

    // ── Hiện / ẩn mật khẩu ──
    document.getElementById('eye').addEventListener('click', function () {
        var show = pwEl.type === 'password';
        pwEl.type = show ? 'text' : 'password';
        this.innerHTML = '<i class="fas fa-eye' + (show ? '-slash' : '') + '"></i>';
        this.setAttribute('aria-label', show ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
        this.title = this.getAttribute('aria-label');
        pwEl.focus();
    });

    // ── Cảnh báo Caps Lock ──
    var capsEl = document.getElementById('caps');
    function checkCaps(e) {
        if (e.getModifierState) capsEl.classList.toggle('show', e.getModifierState('CapsLock'));
    }
    pwEl.addEventListener('keyup', checkCaps);
    pwEl.addEventListener('keydown', checkCaps);
    pwEl.addEventListener('blur', function () { capsEl.classList.remove('show'); });

    // ── Kiểm tra máy chủ ──
    // Render gói miễn phí "ngủ" khi không có truy cập → lần đầu có thể mất ~1 phút để khởi động.
    // Production: hiện "đang khởi động" và tự thử lại. Local: hiện hướng dẫn chạy backend.
    var backendOnline = false;
    var wakeStart = 0;

    function pingHealth(timeoutMs) {
        var ctrl = window.AbortController ? new AbortController() : null;
        var timer = ctrl && setTimeout(function () { ctrl.abort(); }, timeoutMs);
        return fetch(HEALTH, { cache: 'no-store', signal: ctrl && ctrl.signal })
            .then(function (r) { return r.ok; })
            .catch(function () { return false; })
            .then(function (ok) { if (timer) clearTimeout(timer); return ok; });
    }

    function checkBackend() {
        if (!wakeStart) wakeStart = Date.now();
        var slowTimer = setTimeout(function () {
            if (!backendOnline && !IS_LOCAL) {
                setStatus('waking', '<strong>Máy chủ đang khởi động…</strong><br>Lần truy cập đầu tiên có thể mất khoảng 1 phút. Bạn vẫn có thể nhập thông tin trong lúc chờ.');
            }
        }, 1500);

        pingHealth(IS_LOCAL ? 4000 : 20000).then(function (ok) {
            clearTimeout(slowTimer);
            if (ok) {
                var wasWaiting = statusEl.classList.contains('show') && !statusEl.classList.contains('info');
                backendOnline = true;
                if (CFG.USING_PROD_FROM_LOCAL) { showProdFromLocalNote(); return; }
                if (wasWaiting) {
                    setStatus('online', 'Máy chủ đã sẵn sàng.');
                    setTimeout(function () { setStatus(null); }, 2500);
                } else {
                    setStatus(null);
                }
                return;
            }
            backendOnline = false;
            if (IS_LOCAL) {
                setStatus('offline', '<strong>Backend local (cổng 3001) chưa chạy.</strong><br>' +
                    'Chạy <code>cd backend &amp;&amp; npm run dev</code> rồi tải lại trang, hoặc:<br>' +
                    '<button type="button" class="lg-link-btn" id="useProd"><i class="fas fa-globe-asia"></i> Dùng máy chủ thật</button>');
                document.getElementById('useProd').addEventListener('click', function () {
                    try { localStorage.setItem('API_TARGET', 'production'); } catch (e) {}
                    location.reload();
                });
                return;
            }
            var waited = Math.round((Date.now() - wakeStart) / 1000);
            if (waited < 120) {
                setStatus('waking', '<strong>Máy chủ đang khởi động…</strong><br>Đã chờ ' + waited + ' giây, đang thử lại.');
                setTimeout(checkBackend, 5000);
            } else {
                setStatus('offline', '<strong>Không kết nối được máy chủ.</strong><br>Vui lòng thử lại sau ít phút hoặc báo cho người phụ trách kỹ thuật.');
            }
        });
    }
    // Trang mở từ máy local nhưng đang dùng backend thật → luôn nhắc để tránh nhầm khi sửa dữ liệu
    function showProdFromLocalNote() {
        setStatus('info', '<strong>Đang dùng máy chủ thật</strong> (dữ liệu thật) từ trang chạy trên máy. ' +
            '<button type="button" class="lg-link-btn ghost" id="useLocal">Chuyển về backend local</button>');
        document.getElementById('useLocal').addEventListener('click', function () {
            try { localStorage.removeItem('API_TARGET'); } catch (e) {}
            location.reload();
        });
    }
    if (CFG.USING_PROD_FROM_LOCAL) showProdFromLocalNote();
    checkBackend();

    // ── Đăng nhập ──
    function resetBtn() { btn.disabled = false; btn.innerHTML = BTN_HTML; }

    form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = emailEl.value.trim();
        var pw = pwEl.value;

        if (!email || !pw) {
            showMsg('Vui lòng nhập đầy đủ email và mật khẩu.', 'warning', 'exclamation-triangle');
            (email ? pwEl : emailEl).focus();
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + (backendOnline ? 'Đang đăng nhập…' : 'Đang chờ máy chủ…');
        msgEl.innerHTML = '';

        fetch(API + '/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: pw })
        })
        .then(function (res) {
            return res.json().catch(function () { return {}; }).then(function (data) {
                if (res.status === 429) throw { userMsg: data.message || 'Bạn đã thử đăng nhập quá nhiều lần. Vui lòng đợi 15 phút rồi thử lại.' };
                if (!res.ok || !data.success) throw { userMsg: data.message || 'Email hoặc mật khẩu không chính xác.', field: true };
                return data;
            });
        })
        .then(function (data) {
            var user  = data.data && data.data.user;
            var token = data.data && data.data.token;
            if (!token || !user) throw { userMsg: 'Máy chủ trả về dữ liệu không hợp lệ. Vui lòng thử lại.' };

            var role = String(user.role || '').trim().toLowerCase();
            if (role !== 'admin') throw { userMsg: 'Tài khoản này không có quyền quản trị.' };

            user.role = role;
            localStorage.setItem(TOKEN_KEY, token);
            localStorage.setItem(USER_KEY, JSON.stringify(user));

            showMsg('Đăng nhập thành công! Đang chuyển trang…', 'success', 'check-circle');
            btn.innerHTML = '<i class="fas fa-check"></i> Thành công';
            window.location.replace('dashboard.html');
        })
        .catch(function (err) {
            if (err && err.userMsg) {
                showMsg(esc(err.userMsg), 'danger', 'exclamation-circle');
                if (err.field) { pwEl.select(); pwEl.focus(); }
            } else {
                // Lỗi mạng: máy chủ chưa dậy hoặc mất kết nối.
                // Backend local: khung trạng thái phía trên đã giải thích + có nút chuyển → không lặp thêm thông báo.
                if (IS_LOCAL) {
                    msgEl.innerHTML = '';
                } else {
                    showMsg('Không kết nối được máy chủ. Nếu máy chủ đang khởi động, hãy đợi thêm chút rồi bấm Đăng nhập lại.', 'danger', 'wifi');
                }
                if (!backendOnline || IS_LOCAL) { wakeStart = 0; checkBackend(); }
            }
            resetBtn();
        });
    });
}());
</script>
</body>
</html>
