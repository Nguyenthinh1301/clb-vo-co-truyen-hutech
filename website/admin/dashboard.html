<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Admin CLB Võ Cổ Truyền HUTECH</title>
    <link rel="stylesheet" href="shared/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .stat-change {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #a0aec0;
        }
        .stat-change.up   { color: #38a169; }
        .stat-change.down { color: #e53e3e; }
        .stat { cursor: default; }
        .stat:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .stat { transition: transform 0.2s, box-shadow 0.2s; }
        .quick-btns { display: flex; gap: 12px; flex-wrap: wrap; }

        /* 8 thẻ thống kê → 4 cột × 2 hàng (auto-fit cũ để thẻ thứ 6 nằm lẻ một mình) */
        .dash-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        @media (max-width: 1100px) { .dash-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 480px)  { .dash-stats { grid-template-columns: 1fr; } }
        .si-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
        .si-teal   { background: linear-gradient(135deg, #14b8a6, #0f766e); }
        .stat-change.alert-new { color: #dc2626; font-weight: 700; }
        .stat.has-new { box-shadow: 0 0 0 2px rgba(220, 38, 38, 0.35); }
    </style>
</head>
<body>
<div class="layout" id="app"></div>

<script src="../assets/js/config.js"></script>
<script src="shared/auth.js"></script>
<script src="shared/api.js"></script>
<script src="shared/ui.js"></script>
<script>
'use strict';

var page = initLayout('<i class="fas fa-tachometer-alt"></i> Dashboard', 'dashboard.html');
if (page) load();

async function load() {
    page.innerHTML = `
        <!-- Thông báo chung khi máy chủ giới hạn truy cập (429) -->
        <div id="dash-notice"></div>
        <!-- Stats -->
        <div class="stats dash-stats">
            <div class="stat" onclick="location.href='tin-tuc.html'" style="cursor:pointer;" title="Quản lý tin tức">
                <div class="stat-icon si-red"><i class="fas fa-newspaper"></i></div>
                <div>
                    <div class="stat-val" id="s-news"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Tin tức</div>
                    <div class="stat-change" id="s-news-sub"></div>
                </div>
            </div>
            <div class="stat" onclick="location.href='su-kien.html'" style="cursor:pointer;" title="Quản lý sự kiện">
                <div class="stat-icon si-blue"><i class="fas fa-calendar-alt"></i></div>
                <div>
                    <div class="stat-val" id="s-ev"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Sự kiện</div>
                    <div class="stat-change" id="s-ev-sub"></div>
                </div>
            </div>
            <div class="stat" onclick="location.href='thanh-vien.html'" style="cursor:pointer;" title="Quản lý thành viên">
                <div class="stat-icon si-green"><i class="fas fa-users"></i></div>
                <div>
                    <div class="stat-val" id="s-usr"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Thành viên</div>
                    <div class="stat-change" id="s-usr-sub"></div>
                </div>
            </div>
            <div class="stat" onclick="location.href='cam-nhan.html'" style="cursor:pointer;" title="Quản lý cảm nhận sinh viên">
                <div class="stat-icon si-green"><i class="fas fa-heart"></i></div>
                <div>
                    <div class="stat-val" id="s-rv"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Cảm nhận SV</div>
                    <div class="stat-change" id="s-rv-sub"></div>
                </div>
            </div>
            <div class="stat" onclick="location.href='hoat-dong.html'" style="cursor:pointer;" title="Quản lý hoạt động & thành tích">
                <div class="stat-icon si-red"><i class="fas fa-trophy"></i></div>
                <div>
                    <div class="stat-val" id="s-act"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Hoạt động</div>
                    <div class="stat-change" id="s-act-sub"></div>
                </div>
            </div>
            <div class="stat" onclick="location.href='thu-vien.html'" style="cursor:pointer;" title="Quản lý thư viện ảnh">
                <div class="stat-icon si-purple"><i class="fas fa-images"></i></div>
                <div>
                    <div class="stat-val" id="s-gal"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Album ảnh</div>
                    <div class="stat-change" id="s-gal-sub"></div>
                </div>
            </div>
            <div class="stat" id="stat-contact" onclick="location.href='lien-he.html'" style="cursor:pointer;" title="Xem tin nhắn liên hệ">
                <div class="stat-icon si-teal"><i class="fas fa-envelope"></i></div>
                <div>
                    <div class="stat-val" id="s-ct"><i class="fas fa-spinner fa-spin" style="font-size:1rem;color:#cbd5e0;"></i></div>
                    <div class="stat-lbl">Liên hệ</div>
                    <div class="stat-change" id="s-ct-sub"></div>
                </div>
            </div>
        </div>

        <!-- Thao tác nhanh -->
        <div class="card">
            <div class="card-head"><h3><i class="fas fa-bolt"></i> Thao tác nhanh</h3></div>
            <div class="card-body quick-btns">
                <a href="tin-tuc.html" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Đăng tin tức
                </a>
                <a href="su-kien.html" class="btn btn-success">
                    <i class="fas fa-plus"></i> Thêm sự kiện
                </a>
                <a href="thu-vien.html" class="btn btn-outline">
                    <i class="fas fa-images"></i> Thêm ảnh
                </a>
                <a href="lien-he.html" class="btn btn-outline">
                    <i class="fas fa-envelope"></i> Xem liên hệ
                </a>
                <a href="hoat-dong.html" class="btn btn-outline">
                    <i class="fas fa-trophy"></i> Quản lý hoạt động
                </a>
            </div>
        </div>

        <!-- Tin tức & Sự kiện gần đây -->
        <div class="stats" style="align-items:flex-start;">
            <div class="card" style="flex:1;min-width:0;">
                <div class="card-head">
                    <h3><i class="fas fa-newspaper"></i> Tin tức gần đây</h3>
                    <a href="tin-tuc.html" class="btn btn-sm btn-outline">Xem tất cả</a>
                </div>
                <div id="news-list"></div>
            </div>
            <div class="card" style="flex:1;min-width:0;">
                <div class="card-head">
                    <h3><i class="fas fa-calendar-alt"></i> Sự kiện gần đây</h3>
                    <a href="su-kien.html" class="btn btn-sm btn-outline">Xem tất cả</a>
                </div>
                <div id="ev-list"></div>
            </div>
        </div>`;

    // Load tất cả stats song song
    await Promise.allSettled([
        loadNewsStats(),
        loadEventStats(),
        loadUserStats(),
        loadReviewStats(),
        loadActivityStats(),
        loadGalleryStats(),
        loadContactStats()
    ]);

    // Bị giới hạn truy cập: hiện 1 thông báo rõ ràng + nút tải lại, thay vì để người dùng chỉ thấy chữ "Lỗi" trên các thẻ
    if (rateLimited) {
        setHTML('dash-notice',
            '<div class="alert alert-warning" style="margin-bottom:16px;">' +
                '<i class="fas fa-hourglass-half"></i>' +
                '<div><strong>Máy chủ đang tạm giới hạn truy cập</strong> vì có quá nhiều yêu cầu trong thời gian ngắn. ' +
                'Một số số liệu chưa tải được — vui lòng đợi vài phút rồi ' +
                '<a href="#" onclick="location.reload();return false;" style="font-weight:700;">tải lại trang</a>.</div>' +
            '</div>');
    }
}

var rateLimited = false;
function noteError(e) {
    if (e && /quá nhiều|too many|429/i.test(e.message || '')) rateLimited = true;
}

// Nhãn danh mục tin tức — giống trang Tin tức (trước đây dashboard hiện mã thô như "competition")
var CAT_LABELS = {
    general: 'Chung', training: 'Tập luyện', competition: 'Thi đấu',
    event: 'Sự kiện', achievement: 'Thành tích', announcement: 'Thông báo'
};

// Hiện lỗi trên thẻ (escape để thông báo lỗi không chèn được HTML)
function statError(id, e) {
    noteError(e);
    setHTML(id, '<span style="color:#e74c3c;font-size:0.9rem;" title="' + escapeHtml((e && e.message) || '') + '">Lỗi</span>');
    setHTML(id + '-sub', '');
}

// ── Tin tức ──
async function loadNewsStats() {
    try {
        // 1 request lấy tối đa 100 tin → đếm đã đăng / nháp trên toàn bộ, 5 tin đầu dùng cho bảng "gần đây"
        // (CLB có ít tin; nếu > 100 thì số đếm là trên 100 tin mới nhất)
        var r    = await API.news.list(1, 100, '', '');
        var all  = (r.data && r.data.news) || [];
        var total = (r.data && r.data.total) || all.length;
        var published = all.filter(function (n) { return n.status === 'published'; }).length;
        var drafts    = all.filter(function (n) { return n.status === 'draft'; }).length;
        var list = all.slice(0, 5);

        setHTML('s-news', total);
        setHTML('s-news-sub',
            published + ' đã đăng' + (drafts ? ' · ' + drafts + ' nháp' : '')
        );

        if (list.length) {
            setHTML('news-list',
                '<div class="tbl"><table>' +
                '<thead><tr><th>Tiêu đề</th><th style="width:90px;">Danh mục</th><th style="width:80px;">Trạng thái</th><th style="width:85px;">Ngày</th></tr></thead>' +
                '<tbody>' +
                list.map(function (n) {
                    var statusCls = n.status === 'published' ? 'b-success' : 'b-warning';
                    var statusLbl = n.status === 'published' ? 'Đã đăng' : 'Nháp';
                    return '<tr>' +
                        '<td><b style="color:#1a252f;">' + safe(n.title, 40) + '</b></td>' +
                        '<td style="font-size:0.8rem;color:#4a5568;">' + escapeHtml(CAT_LABELS[n.category] || n.category || '—') + '</td>' +
                        '<td><span class="badge ' + statusCls + '">' + statusLbl + '</span></td>' +
                        '<td style="font-size:0.8rem;color:#718096;">' + fmtDate(n.created_at) + '</td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table></div>'
            );
        } else {
            empty('news-list', 'newspaper', 'Chưa có tin tức nào');
        }
    } catch (e) {
        statError('s-news', e);
        empty('news-list', 'exclamation-circle', 'Không thể tải: ' + escapeHtml(e.message || ''));
    }
}

// ── Sự kiện ──
async function loadEventStats() {
    try {
        // Đếm "sắp tới" / "đang diễn ra" trên toàn bộ sự kiện (trước đây chỉ đếm trong 5 sự kiện mới nhất)
        var r    = await API.events.list(1, 100, '', '', '');
        var allEv = (r.data && r.data.events) || [];
        var total = (r.data && r.data.total) || allEv.length;
        var list = allEv.slice(0, 5);

        setHTML('s-ev', total);

        var upcoming = allEv.filter(function (ev) { return ev.status === 'upcoming'; }).length;
        var ongoing  = allEv.filter(function (ev) { return ev.status === 'ongoing';  }).length;
        var subParts = [];
        if (ongoing)  subParts.push('<span style="color:#38a169;">' + ongoing  + ' đang diễn ra</span>');
        if (upcoming) subParts.push(upcoming + ' sắp tới');
        setHTML('s-ev-sub', subParts.join(' · ') || '&nbsp;');

        if (list.length) {
            setHTML('ev-list',
                '<div class="tbl"><table>' +
                '<thead><tr><th>Tên sự kiện</th><th style="width:85px;">Ngày</th><th style="width:100px;">Trạng thái</th></tr></thead>' +
                '<tbody>' +
                list.map(function (ev) {
                    var stCls = { upcoming:'b-info', ongoing:'b-success', completed:'b-secondary', cancelled:'b-danger' };
                    var stLbl = { upcoming:'Sắp tới', ongoing:'Đang diễn', completed:'Kết thúc', cancelled:'Đã hủy' };
                    return '<tr>' +
                        '<td><b style="color:#1a252f;">' + safe(ev.name, 38) + '</b>' +
                            (ev.location ? '<br><span style="color:#718096;font-size:0.75rem;"><i class="fas fa-map-marker-alt"></i> ' + safe(ev.location, 28) + '</span>' : '') +
                        '</td>' +
                        '<td style="font-size:0.8rem;color:#718096;">' + fmtDate(ev.date) + '</td>' +
                        '<td><span class="badge ' + (stCls[ev.status] || 'b-secondary') + '">' + (stLbl[ev.status] || ev.status) + '</span></td>' +
                        '</tr>';
                }).join('') +
                '</tbody></table></div>'
            );
        } else {
            empty('ev-list', 'calendar-alt', 'Chưa có sự kiện nào');
        }
    } catch (e) {
        statError('s-ev', e);
        empty('ev-list', 'exclamation-circle', 'Không thể tải: ' + escapeHtml(e.message || ''));
    }
}

// ── Thành viên ──
async function loadUserStats() {
    try {
        // Tổng tài khoản + số thành viên có trạng thái "active" (trước đây ghi "đang hoạt động" cho TỔNG tài khoản)
        var r      = await API.users.list(1, 100);
        var users  = (r.data && (r.data.users || r.data)) || [];
        if (!Array.isArray(users)) users = [];
        var total  = (r.pagination && r.pagination.total) || users.length;
        var active = users.filter(function (u) { return u.membership_status === 'active' && u.is_active !== false && u.is_active !== 0; }).length;
        setHTML('s-usr', total);
        setHTML('s-usr-sub', active + ' đang hoạt động' + (total - active > 0 ? ' · ' + (total - active) + ' khác' : ''));
    } catch (e) {
        statError('s-usr', e);
    }
}

// ── Cảm nhận sinh viên ──
async function loadReviewStats() {
    try {
        var r    = await API.reviews.list();
        var all  = r.data || [];
        var active = all.filter(function (rv) { return rv.status === 'active'; }).length;
        // Tính điểm trung bình
        var avg = all.length
            ? (all.reduce(function (s, rv) { return s + (parseInt(rv.rating) || 5); }, 0) / all.length).toFixed(1)
            : null;
        setHTML('s-rv', all.length);
        setHTML('s-rv-sub',
            active + ' đang hiển thị' +
            (avg ? ' · ⭐ ' + avg : '')
        );
    } catch (e) {
        statError('s-rv', e);
    }
}

// ── Hoạt động & Thành tích ──
async function loadActivityStats() {
    try {
        var r   = await API.activities.list('', '', '1');
        var all = r.data || [];
        var active = all.filter(function(a) { return a.status === 'active'; }).length;
        var gold   = all.filter(function(a) { return a.medal === 'gold'; }).length;
        setHTML('s-act', all.length);
        setHTML('s-act-sub',
            active + ' đang hiển thị' +
            (gold ? ' · 🥇 ' + gold + ' HCV' : '')
        );
    } catch (e) {
        statError('s-act', e);
    }
}

// ── Thư viện ảnh ──
async function loadGalleryStats() {
    try {
        var r = await API.gallery.albums(true);
        var albums = Array.isArray(r.data) ? r.data : ((r.data && r.data.albums) || []);
        var photos = albums.reduce(function (s, a) { return s + (parseInt(a.photo_count) || 0); }, 0);
        var active = albums.filter(function (a) { return a.status === 'active'; }).length;
        setHTML('s-gal', albums.length);
        setHTML('s-gal-sub', photos + ' ảnh · ' + active + ' đang hiển thị');
    } catch (e) {
        statError('s-gal', e);
    }
}

// ── Liên hệ: nổi bật khi có tin nhắn mới chưa đọc ──
async function loadContactStats() {
    try {
        var r = await API.get('/contact/stats/overview');
        var o = (r.data && r.data.overall) || {};
        var total = parseInt(o.total_messages) || 0;
        var fresh = parseInt(o.new_messages) || 0;
        setHTML('s-ct', total);
        if (fresh > 0) {
            setHTML('s-ct-sub', '<span class="stat-change alert-new">' + fresh + ' tin mới chưa đọc</span>');
            var card = document.getElementById('stat-contact');
            if (card) card.classList.add('has-new');
        } else {
            setHTML('s-ct-sub', 'Không có tin mới');
        }
    } catch (e) {
        statError('s-ct', e);
    }
}</script>
</body>
</html>
